name: Create release PR

on:
   workflow_dispatch:
      inputs:
         release:
            description: 'Define release version (ex: v1, v2, v3)'
            required: true

permissions: {}

jobs:
   release-pr:
      uses: OliverMKing/javascript-release-workflow/.github/workflows/release-pr.yml@a2f171c6ca04fea2de31f4dbb6dc576140395512 # main
      with:
         release: ${{ github.event.inputs.release }}
