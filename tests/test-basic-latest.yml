name: Test kubectl installer - latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'latest'
      - name: Assert kubectl-path output is set
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: $KUBECTL_PATH"
          if [ -z "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path output is empty"
            exit 1
          fi
          echo "PASS: kubectl-path is set to '$KUBECTL_PATH'"
      - name: Assert kubectl binary exists and is executable
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Checking kubectl binary at: $KUBECTL_PATH"
          if [ ! -f "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary not found at '$KUBECTL_PATH'"
            exit 1
          fi
          if [ ! -x "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary is not executable"
            exit 1
          fi
          echo "PASS: kubectl binary exists and is executable"
      - name: Assert kubectl is on PATH and responds
        run: |
          echo "kubectl location: $(which kubectl || echo 'not found on PATH')"
          # Use --help as a reliable way to verify kubectl works (always exits 0)
          kubectl --help > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: kubectl --help failed"
            exit 1
          fi
          echo "PASS: kubectl is functional"
