name: Test kubectl installer - latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'latest'
      - name: Assert kubectl-path output is set
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: $KUBECTL_PATH"
          if [ -z "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path output is empty"
            exit 1
          fi
          echo "PASS: kubectl-path is set to $KUBECTL_PATH"
      - name: Assert kubectl binary exists at reported path
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Checking kubectl binary at: $KUBECTL_PATH"
          if [ ! -f "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary not found at $KUBECTL_PATH"
            exit 1
          fi
          echo "PASS: kubectl binary exists at $KUBECTL_PATH"
      - name: Assert kubectl is executable and returns version
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Running kubectl version..."
          "$KUBECTL_PATH" version --client
          if [ $? -ne 0 ]; then
            echo "FAIL: kubectl version command failed"
            exit 1
          fi
          echo "PASS: kubectl is functional"
