name: Test kubectl installer - specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'v1.28.0'
      - name: Assert kubectl-path output is set
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: $KUBECTL_PATH"
          if [ -z "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path output is empty"
            exit 1
          fi
          echo "PASS: kubectl-path is set to $KUBECTL_PATH"
      - name: Assert kubectl binary exists at output path
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Checking for kubectl at: $KUBECTL_PATH"
          if [ ! -f "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary not found at $KUBECTL_PATH"
            exit 1
          fi
          echo "PASS: kubectl binary exists at $KUBECTL_PATH"
      - name: Assert kubectl is executable
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Checking kubectl is executable"
          if [ ! -x "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary is not executable"
            exit 1
          fi
          echo "PASS: kubectl binary is executable"
      - name: Assert kubectl version matches requested version
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Checking kubectl version"
          VERSION_OUTPUT=$("$KUBECTL_PATH" version --client 2>&1 || true)
          echo "Version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qE "1\.28\."; then
            echo "PASS: kubectl version contains 1.28"
          else
            echo "FAIL: expected version 1.28.0 but version output was: $VERSION_OUTPUT"
            exit 1
          fi
      - name: Assert kubectl is in PATH
        run: |
          echo "Checking kubectl is in PATH"
          which kubectl || { echo "FAIL: kubectl not found in PATH"; exit 1; }
          echo "PASS: kubectl found in PATH at $(which kubectl)"
