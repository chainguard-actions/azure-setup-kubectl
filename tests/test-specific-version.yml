name: Test kubectl installer - specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'v1.28.0'
      - name: Assert kubectl-path output is set
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "kubectl-path: $KUBECTL_PATH"
          if [ -z "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl-path output is empty"
            exit 1
          fi
          echo "PASS: kubectl-path is set to '$KUBECTL_PATH'"
      - name: Assert kubectl binary exists and is executable
        env:
          KUBECTL_PATH: ${{ steps.action.outputs.kubectl-path }}
        run: |
          echo "Checking kubectl binary at: $KUBECTL_PATH"
          if [ ! -f "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary not found at '$KUBECTL_PATH'"
            exit 1
          fi
          if [ ! -x "$KUBECTL_PATH" ]; then
            echo "FAIL: kubectl binary is not executable"
            exit 1
          fi
          echo "PASS: kubectl binary exists and is executable"
      - name: Assert kubectl version matches expected
        run: |
          # kubectl version --client outputs version info; grep for the expected version
          VERSION_OUTPUT=$(kubectl version --client 2>&1 || true)
          echo "kubectl version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "v1.28.0"; then
            echo "PASS: kubectl version is v1.28.0"
          else
            echo "FAIL: expected v1.28.0 in version output but got: $VERSION_OUTPUT"
            exit 1
          fi
